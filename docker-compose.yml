version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - tagsfinal_n8n_data:/home/node/.n8n
      - ./n8nScript:/home/node/.n8n/workflows
      - ./Data:/home/node/.n8n/data
    networks:
      - n8n-network

volumes:
  tagsfinal_n8n_data:
    external: true

networks:
  n8n-network:
    driver: bridge
